about_title: About Me
about_profile_image: images/profile.png
about_content: | # this will include new lines to allow paragraphs
    Professional with a hybrid background combining hands-on premium catering operations experience in London and strong technical capabilities in data processing and system configuration.

    I spent over five years working in high-volume, high-standard catering environments, including iconic cultural institutions in London, where I developed a strong understanding of operational execution, service logistics, timing, and coordination in demanding environments.

    Alongside this operational experience, I have built solid expertise in data handling, workflow optimization, and system configuration within technical environments. This has strengthened my ability to manage structured operational data with precision, consistency, and attention to detail.

    I am particularly motivated to transition into aviation catering operations, where I can contribute to flight planning support, menu configuration, load planning, and cross-department coordination, combining operational experience with analytical capabilities.

    Fluent in English and Spanish, with experience working in international and fast-paced environments.
